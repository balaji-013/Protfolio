<section class="position-relative d-flex flex-column align-items-center justify-content-center overflow-hidden w-100" style="min-height: 100vh; padding-top: 8rem; padding-bottom: 6rem;">
  <div class="position-absolute w-100 h-100 top-0 start-50 translate-middle-x bg-transparent" style="z-index: 0; opacity: 0.2; pointer-events: none;">
    <!-- Glowing Orbs (with antigravity) -->
    <div [@antigravity] class="position-absolute bg-primary-container rounded-pill blur-120" style="top: 25%; left: 25%; width: 24rem; height: 24rem;"></div>
    <div [@antigravity] class="position-absolute rounded-pill blur-120" style="bottom: 25%; right: 25%; width: 24rem; height: 24rem; background-color: var(--on-primary-fixed-variant);"></div>
  </div>

  <div class="container-max w-100 px-4 position-relative" style="z-index: 1;">
    <div class="row align-items-center gap-gutter">
      <div class="col-md-7 d-flex flex-column gap-element">
        <span class="text-primary font-display text-label-caps tracking-wide">{{ role }}</span>
        <h1 class="text-white-toggle font-display text-display lh-sm mb-4">
          Building the <span class="text-primary-container">{{ displayText }}</span><span class="typing-cursor">|</span> &amp; Beyond
        </h1>
        <p class="text-on-surface-variant font-display text-body-lg mb-5" style="max-width: 600px;">
          {{ summary }}
        </p>
        <div class="d-flex flex-wrap gap-3">
          <button (click)="scrollTo('projects')" class="btn bg-primary-container text-on-primary-container rounded-pill text-headline-md border-0 electric-glow-strong d-flex align-items-center transition-all" style="padding: 1rem 2.5rem; gap: 0.5rem;">View Projects</button>
          <button (click)="scrollTo('contact')" class="btn border-outline-variant text-white-toggle rounded-pill text-headline-md bg-transparent hover:border-primary transition-all" style="padding: 1rem 2.5rem;">
            Contact Me
          </button>
        </div>
      </div>

      <div class="col-md-4 offset-md-1 position-relative mt-5 mt-md-0">
        <div [@antigravity]="{ value: '*', params: { time: '8s' } }" class="glass-card rounded-xl p-4 position-relative transition-all hover-scale" style="z-index: 2; border: 1px solid rgba(var(--primary-rgb, 0,224,255),0.2);">
          <div class="d-flex align-items-center gap-3 mb-4">
            <div class="rounded-pill d-flex align-items-center justify-content-center fw-bold text-white-toggle" style="width: 3rem; height: 3rem; background: linear-gradient(135deg, var(--primary-container), var(--primary));">BS</div>
            <div>
              <div class="text-white-toggle font-display fw-semibold">Balaji S</div>
              <div class="text-on-surface-variant font-display" style="font-size: 0.85rem;">Full Stack Developer</div>
            </div>
          </div>
          <div class="d-flex flex-column gap-3">
            <div class="d-flex justify-content-between align-items-center px-3 py-2 rounded-pill" style="background: rgba(255,255,255,0.03); border: 1px solid var(--outline-variant);">
              <span class="text-on-surface-variant font-display">System Efficiency</span>
              <strong class="text-primary">+30%</strong>
            </div>
            <div class="d-flex justify-content-between align-items-center px-3 py-2 rounded-pill" style="background: rgba(255,255,255,0.03); border: 1px solid var(--outline-variant);">
              <span class="text-on-surface-variant font-display">Bug Reduction</span>
              <strong class="text-primary">-40%</strong>
            </div>
            <div class="d-flex justify-content-between align-items-center px-3 py-2 rounded-pill" style="background: rgba(255,255,255,0.03); border: 1px solid var(--outline-variant);">
              <span class="text-on-surface-variant font-display">Experience</span>
              <strong class="text-primary">2.5+ Years</strong>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
